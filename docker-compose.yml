services:
  postgres:
    image: postgres:16-alpine
    container_name: uniformes-medicos-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: uniformes_medicos
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - uniformes_medicos_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d uniformes_medicos"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  uniformes_medicos_pgdata:
